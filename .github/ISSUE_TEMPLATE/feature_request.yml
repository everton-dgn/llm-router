name: Feature request
description: Propose a change to llm-router
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem and who experiences it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the observable result, including a concrete example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List workarounds or designs you already considered.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and risk
      description: Note changes to routing, schemas, permissions, providers, or stored session metadata.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: I can describe how this change would be tested.
          required: true
