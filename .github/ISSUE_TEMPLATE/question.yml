name: Question
description: Ask for help with setup, configuration, or behavior
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the desired outcome and the route or mode involved.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include relevant commands and sanitized configuration.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the llm-router commit or tag, OS, OpenCode, Node.js, and provider versions that apply.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Remove credentials, personal data, and private prompts.
      render: shell
