version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bahia
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bahia
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: fix
      include: scope

  - package-ecosystem: npm
    directory: /opencode
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bahia
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: fix
      include: scope
