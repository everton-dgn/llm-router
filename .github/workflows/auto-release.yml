name: Automatic release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

concurrency:
  group: automatic-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out the verified CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - name: Create, merge, and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RELEASE_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          RELEASE_SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RELEASE_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/automatic-release-pr.mjs
